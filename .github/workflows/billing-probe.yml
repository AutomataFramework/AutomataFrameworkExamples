# Throwaway probe, deleted before the pull request is ready.
name: billing-probe
on:
  push:
    branches: [claude/project-thread-u5i846]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          K: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          curl -sS -m 30 -H "Authorization: Bearer $K" https://api.runpod.io/v2/openapi.json -o spec.json
          python3 - <<'PY'
          import json
          s=json.load(open('spec.json'))
          for p,ops in s['paths'].items():
              for m,o in ops.items():
                  if isinstance(o,dict): print(m.upper(),p,'|',o.get('x-runpod-scope'),'|',(o.get('summary') or '')[:70])
          PY
