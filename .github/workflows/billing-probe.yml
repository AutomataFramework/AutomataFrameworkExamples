# Throwaway: measures RunPod's billing endpoint from a GitHub runner. Deleted before the pull request is ready.
name: billing-probe
on:
  push:
    branches: [claude/project-thread-u5i846]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          K: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          echo "key length: ${#K}, first 3 chars: $(printf %s "$K" | cut -c1-3 | sed 's/./&-/g')"
          q='{"query":"query { myself { id } }"}'
          echo "== GraphQL bearer"; curl -sS -m 30 -w '\nHTTP %{http_code}\n' -X POST -H "Authorization: Bearer $K" -H 'content-type: application/json' -d "$q" https://api.runpod.io/graphql | head -c 800
          echo "== GraphQL query param"; curl -sS -m 30 -w '\nHTTP %{http_code}\n' -X POST -H 'content-type: application/json' -d "$q" "https://api.runpod.io/graphql?api_key=$K" | head -c 800
          for h in rest.runpod.io api.runpod.ai api.runpod.io; do
            echo "== $h /v1/billing/pods"; curl -sS -m 30 -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $K" "https://$h/v1/billing/pods" | head -c 1500
          done
