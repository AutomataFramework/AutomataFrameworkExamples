# Throwaway probe, deleted before the pull request is ready.
name: billing-probe
on:
  push:
    branches: [claude/project-thread-u5i846]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          K: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          echo "== pod shape (env, args, cmd removed)"
          curl -sS -m 30 -H "Authorization: Bearer $K" https://api.runpod.io/v2/pods | jq '.pods[] | del(.env, .args, .cmd, .entrypoint)'
          for p in v2/openapi.json v2/openapi.yaml v2/docs v2/swagger.json openapi.json v2/gpu v2/gpu-availability v2/datacenters v2/cpu-flavors v2/billing/pods?grouping=podId; do
            echo "== GET /$p"; curl -sS -m 30 -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $K" "https://api.runpod.io/$p" | head -c 1200
          done
