# Throwaway probe, deleted before the pull request is ready.
name: billing-probe
on:
  push:
    branches: [claude/project-thread-u5i846]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          K: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          curl -sS -m 30 -H "Authorization: Bearer $K" https://api.runpod.io/v2/openapi.json -o spec.json
          python3 - <<'PY'
          import json
          s=json.load(open('spec.json'))
          def res(x,d=0):
              if isinstance(x,dict):
                  if '$ref' in x and d<6:
                      n=x['$ref'].split('/')
                      t=s
                      for k in n[1:]: t=t[k]
                      return res(t,d+1)
                  return {k:res(v,d) for k,v in x.items() if k not in ('description','example','examples','x-runpod-scope')}
              if isinstance(x,list): return [res(i,d) for i in x]
              return x
          for p,m in [('/v2/pods','get'),('/v2/pods','post'),('/v2/pods/{id}','delete'),('/v2/billing/pods','get'),('/v2/catalog/gpus','get')]:
              o=s['paths'][p][m]
              print('#####',m.upper(),p)
              print(json.dumps(res({'parameters':o.get('parameters'),'body':o.get('requestBody'),'ok':{k:v for k,v in o.get('responses',{}).items() if k.startswith('2')}}),separators=(',',':'))[:6000])
          PY
          echo '#### live catalog'
          curl -sS -m 30 -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $K" "https://api.runpod.io/v2/catalog/gpus" | head -c 2500
