# Throwaway probe, deleted before the pull request is ready. Makes one tiny pod and deletes it at once.
name: billing-probe
on:
  push:
    branches: [claude/project-thread-u5i846]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          K: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -u
          call() { curl -sS -m 40 -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $K" -H 'content-type: application/json' "$@"; }
          echo "== bogus gpu id (expect an error that may list the valid ids)"
          call -X POST https://api.runpod.io/v2/pods -d '{"name":"ax-ci-probe-bogus","image":"busybox:latest","cloud":"SECURE","gpu":{"id":"does-not-exist"},"disk":20}' | head -c 1500
          pod=""
          trap '[ -n "$pod" ] && call -X DELETE "https://api.runpod.io/v2/pods/$pod" | head -c 300' EXIT
          for g in "NVIDIA GeForce RTX 4090" "RTX 4090" "NVIDIA_GEFORCE_RTX_4090" "GEFORCE_RTX_4090" "geforce-rtx-4090"; do
            echo "== create with gpu id: $g"
            out=$(call -X POST https://api.runpod.io/v2/pods -d "{\"name\":\"ax-ci-probe-$RANDOM\",\"image\":\"busybox:latest\",\"cloud\":\"SECURE\",\"gpu\":{\"id\":\"$g\"},\"disk\":20,\"entrypoint\":[\"sleep\"],\"cmd\":[\"60\"],\"env\":{\"PROBE\":\"1\"}}")
            echo "$out" | head -c 1800
            pod=$(printf '%s' "$out" | sed '$d' | jq -r '.id // empty' 2>/dev/null || true)
            [ -n "$pod" ] && break
          done
          echo
          if [ -n "$pod" ]; then
            echo "== list shows it"; call "https://api.runpod.io/v2/pods" | sed '$d' | jq -c --arg id "$pod" '.pods[] | select(.id==$id) | del(.env,.args,.cmd,.entrypoint,.ssh)'
            echo "== billing, this pod"; call "https://api.runpod.io/v2/billing/pods?podId=$pod" | head -c 400
          fi
